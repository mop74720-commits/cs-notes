name: mirror-csdiy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-csdiy.yml"

permissions:
  contents: write

concurrency:
  group: mirror-csdiy
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone upstream CS DIY
        run: |
          rm -rf /tmp/csdiy-upstream
          git clone --depth 1 https://github.com/PKUFlyingPig/cs-self-learning.git /tmp/csdiy-upstream

      - name: Replace repository with upstream content
        run: |
          rsync -a --delete             --exclude '.git'             --exclude '.github/workflows/sync-csdiy.yml'             /tmp/csdiy-upstream/ ./

          # Do not bind the upstream custom domain.
          rm -f docs/CNAME

          # Do not reuse the upstream Giscus repository/category identifiers.
          mkdir -p overrides/partials
          cat > overrides/partials/comments.html <<'EOF'
          <!-- Giscus disabled in this mirror. Configure this site's own repo/category IDs if needed. -->
          EOF

          # Keep the upstream site/content/theme, but use this repository's Pages URL and repo links.
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("mkdocs.yml")
          s = p.read_text(encoding="utf-8")

          s = re.sub(r'^site_url:.*$', 'site_url: https://mop74720-commits.github.io/cs-notes/', s, flags=re.M)
          s = re.sub(r'^repo_name:.*$', 'repo_name: cs-notes', s, flags=re.M)
          s = re.sub(r'^repo_url:.*$', 'repo_url: https://github.com/mop74720-commits/cs-notes/', s, flags=re.M)
          s = s.replace(
              'link: https://github.com/pkuflyingpig/cs-self-learning/',
              'link: https://github.com/mop74720-commits/cs-notes/'
          )

          # Remove upstream Google Analytics only; this does not affect site appearance.
          s = re.sub(
              r'\n  analytics:\n    provider: google\n    property: G-KJB4RXSKZG\n',
              '\n',
              s
          )

          p.write_text(s, encoding="utf-8")
          PY

          # Upstream currently pins old dependencies. Python 3.12 keeps them installable in 2026.
          cat > .github/workflows/ci.yml <<'EOF'
          name: ci

          on:
            push:
              branches:
                - master
                - main

          permissions:
            contents: write

          concurrency:
            group: mkdocs-pages
            cancel-in-progress: true

          jobs:
            deploy:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                  with:
                    fetch-depth: 0

                - uses: actions/setup-python@v5
                  with:
                    python-version: "3.12"

                - run: pip3 install -U -r requirements.txt
                - run: mkdocs gh-deploy --force
          EOF

      - name: Commit mirror
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Already matches upstream."
            exit 0
          fi

          git commit -m "Mirror CS DIY Wiki"
          git push
