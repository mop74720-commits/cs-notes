name: sync-csdiy-content

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-csdiy.yml"

permissions:
  contents: write

concurrency:
  group: sync-csdiy-content
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone upstream CS DIY
        run: |
          rm -rf .upstream-csdiy
          git clone --depth 1 https://github.com/PKUFlyingPig/cs-self-learning.git .upstream-csdiy

      - name: Sync upstream docs and license
        run: |
          rm -rf docs/csdiy
          mkdir -p docs/csdiy
          cp -a .upstream-csdiy/docs/. docs/csdiy/

          mkdir -p third_party/csdiy
          cp .upstream-csdiy/LICENSE third_party/csdiy/LICENSE
          cp .upstream-csdiy/mkdocs.yml third_party/csdiy/mkdocs-upstream.yml

          UPSTREAM_SHA="$(git -C .upstream-csdiy rev-parse HEAD)"
          cat > third_party/csdiy/README.md <<EOF
          # CS DIY upstream snapshot

          Source: https://github.com/PKUFlyingPig/cs-self-learning

          Upstream commit: ${UPSTREAM_SHA}

          License: MIT. See `LICENSE` in this directory.

          This snapshot is included for learning and redistribution under the
          upstream repository's MIT license. External resources linked from the
          upstream documentation remain subject to their own licenses/terms.
          EOF

          rm -rf .upstream-csdiy

      - name: Commit synchronized snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/csdiy third_party/csdiy

          if git diff --cached --quiet; then
            echo "No upstream changes to sync."
            exit 0
          fi

          git commit -m "Sync CS DIY learning content"
          git push
