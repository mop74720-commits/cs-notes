name: import-backend-note-assets

on:
  push:
    branches:
      - main
    paths:
      - ".transfer/backend-assets/**"

permissions:
  contents: write

concurrency:
  group: import-backend-note-assets
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cs-notes
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and verify asset payload
        shell: bash
        run: |
          set -euo pipefail
          parts=(.transfer/backend-assets/backend-assets.tar.gz.part-*)
          if [ "${#parts[@]}" -eq 0 ]; then
            echo "No transfer chunks found."
            exit 1
          fi
          cat "${parts[@]}" > /tmp/backend-assets.tar.gz
          expected="$(awk '{print $1}' .transfer/backend-assets/backend-assets.tar.gz.sha256)"
          actual="$(sha256sum /tmp/backend-assets.tar.gz | awk '{print $1}')"
          test "$expected" = "$actual"
          echo "payload sha256 verified: $actual"

      - name: Extract mapped image assets
        shell: bash
        run: |
          set -euo pipefail
          tar -C "$GITHUB_WORKSPACE" -xzf /tmp/backend-assets.tar.gz
          echo "imported_files=$(find docs -path '*/.assets/*' -type f | wc -l)"
          du -sh docs || true

      - name: Remove transfer chunks and commit images
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .transfer/backend-assets
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No asset changes."
            exit 0
          fi

          git commit -m "Import backend note images"
          git push
