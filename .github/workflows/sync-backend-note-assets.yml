name: import-backend-note-assets

on:
  push:
    branches:
      - main
    paths:
      - ".github/backend-assets-urls.txt"

permissions:
  contents: write

concurrency:
  group: import-backend-note-assets
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cs-notes
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download private transfer chunks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/backend-parts
          expected=""

          while IFS=$'\t' read -r name value; do
            [ -z "$name" ] && continue
            if [ "$name" = "SHA256" ]; then
              expected="$value"
              continue
            fi
            echo "Downloading $name"
            curl -fL --retry 4 --retry-delay 2 "$value" -o "/tmp/backend-parts/$name"
          done < .github/backend-assets-urls.txt

          test -n "$expected"
          cat /tmp/backend-parts/backend-assets.tar.gz.part-* > /tmp/backend-assets.tar.gz
          actual="$(sha256sum /tmp/backend-assets.tar.gz | awk '{print $1}')"
          echo "expected=$expected"
          echo "actual=$actual"
          test "$expected" = "$actual"

      - name: Extract mapped image assets
        shell: bash
        run: |
          set -euo pipefail
          tar -C "$GITHUB_WORKSPACE" -xzf /tmp/backend-assets.tar.gz
          count="$(find docs -path '*/.assets/*' -type f | wc -l)"
          echo "imported_files=$count"
          test "$count" -gt 0
          du -sh docs || true

      - name: Remove transfer manifest and commit images
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/backend-assets-urls.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import backend note images"
          git push
