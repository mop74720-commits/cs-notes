name: fix-hidden-note-assets

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-hidden-note-assets.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rename hidden asset directories
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' dirs < <(find docs -type d -name '.assets' -print0)

          echo "hidden_asset_dirs=${#dirs[@]}"
          test "${#dirs[@]}" -gt 0

          for d in "${dirs[@]}"; do
            target="${d%/.assets}/assets"
            if [ -e "$target" ]; then
              echo "Target already exists: $target" >&2
              exit 1
            fi
            mv "$d" "$target"
          done

          find docs -type f -name '*.md' -print0 | xargs -0 sed -i 's#\.assets/#assets/#g'

          remaining="$(find docs -type d -name '.assets' | wc -l)"
          refs="$(grep -RIl --include='*.md' '\.assets/' docs | wc -l)"
          echo "remaining_hidden_dirs=$remaining"
          echo "md_files_with_old_refs=$refs"
          test "$remaining" -eq 0
          test "$refs" -eq 0

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish backend note images through MkDocs"
          git push
